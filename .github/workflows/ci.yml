name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Satchel.slnx

      - name: Build
        run: dotnet build Satchel.slnx -c Release --no-restore

      # Live API tests are opt-in (SATCHEL_LIVE=1) and skipped here so CI never depends on third-party uptime.
      - name: Test
        run: dotnet test tests/Satchel.Tests/Satchel.Tests.csproj -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          retention-days: 7

      - name: Publish (smoke)
        shell: pwsh
        run: |
          dotnet publish src/Satchel/Satchel.csproj -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:DebugType=none -o artifacts/Satchel
          if (-not (Test-Path artifacts/Satchel/Satchel.exe)) { throw "Satchel.exe was not produced" }

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Satchel-${{ github.sha }}
          path: artifacts/Satchel
          retention-days: 7

      - name: Build installer (smoke)
        shell: pwsh
        run: |
          dotnet publish src/Satchel/Satchel.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none -p:Version=0.0.0-ci -o artifacts/self-contained
          ./installer/build-installer.ps1 -Version 0.0.0-ci -SourceDir artifacts/self-contained -OutputDir artifacts/installer -InstallInnoIfMissing

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Satchel-Setup-${{ github.sha }}
          path: artifacts/installer
          retention-days: 7
